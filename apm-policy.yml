# Generated by claude-pack.
# Controls trust gates for MCP servers and transitive deps.
# Tighten as your needs evolve. See: https://microsoft.github.io/apm/

policy:
  # Require explicit consent before installing MCP servers brought in
  # transitively by other APM packages.
  trustTransitiveMcp: prompt

  # Pin content hashes — fail the install if a dep's content drifts.
  requireHashes: true

  # Allowlist of hosts where APM may fetch packages.
  allowedHosts:
    - github.com
